name: Firebase Catalog Backup & Local Sync

on:
  # 1. Automatic scheduled synchronization (daily at 2:00 AM UTC)
  schedule:
    - cron: '0 2 * * *'

  # 2. Manual on-demand synchronization triggered from GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync (download all items regardless of last sync timestamp)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync_catalog:
    name: Sync Firebase to Local Source Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Firebase Sync Engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync }}
        run: |
          npx tsx scripts/sync-firebase.ts

      - name: Build Verification (Zero Dependency & Clean Static Bundle)
        run: |
          npm run build

      - name: Pre-Commit Security & Secret Leak Prevention
        run: |
          echo "Scanning staged and untracked files for sensitive credentials..."
          # Disallow any .env files, private keys, or credential files from being added
          FORBIDDEN_FILES=$(git status --porcelain | grep -iE '\.env|\.pem|\.key|credential|serviceaccount|secret' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Potential sensitive files detected in working directory:"
            echo "$FORBIDDEN_FILES"
            echo "ABORTING COMMIT TO PREVENT SECRET LEAKS."
            exit 1
          fi
          echo "Security scan passed: No forbidden files or secrets detected."

      - name: Commit and Push Verified Backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the intended backup assets and metadata
          git add src/data/products.json src/data/sync_metadata.json public/images/products/

          # Check if there are any staged changes
          if git diff --staged --quiet; then
            echo "Catalog is already completely synchronized. Nothing new to commit."
          else
            SYNC_COUNT=$(node -e "console.log(require('./src/data/products.json').length)")
            git commit -m "chore(sync): automated Firebase catalog backup (${SYNC_COUNT} products) [skip ci]"
            git push origin ${{ github.ref_name || 'main' }}
            echo "Successfully committed and pushed updated catalog and local images to GitHub!"
            echo "Vercel will now automatically deploy the updated static website."
          fi
